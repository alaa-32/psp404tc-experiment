name: Publish public preview (no collection)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_COLLECTION_MODE: preview
      VITE_PUBLIC_PREVIEW: 'true'
      VITE_SUBMISSION_ENDPOINT: ''
      PUBLIC_PREVIEW_CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.0'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-public-source.mjs
      - run: pnpm test && pnpm build
      - run: node scripts/check-preview.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
